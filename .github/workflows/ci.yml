name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Astro's telemetry is also turned off in scripts/build.mjs and the typecheck script; this is a second guard.
  ASTRO_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Spec vectors are the pinned copy
        run: npm run check:spec
      - name: Help, Privacy and Terms texts are the pinned copies
        run: npm run check:legal
      - name: Design tokens and marks are the pinned copies
        run: npm run check:tokens
      - name: Build (vendor check, type check, bundle)
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Weight budget
        run: npm run check:budget
      - name: Headers, rewrite, 404 and AASA on the local preview
        run: npm run check:headers
      - name: The same on Cloudflare's local Pages emulation
        run: npm run check:pages
      - name: The AWS host build, its generated CloudFront configuration current, and the same check on its local emulation
        run: node scripts/build.mjs --host=aws && npm run check:aws
      - name: The GitHub Pages fallback builds too
        run: node scripts/build.mjs --host=github-pages && npm run check:budget
      - name: The launch fixture build (released state) passes the budget and the header checks
        run: node scripts/build.mjs --launch=fixture && npm run check:budget -- --launch=fixture && npm run check:headers -- --launch=fixture && npm run check:pages -- --launch=fixture && npm run check:aws -- --launch=fixture
      - name: The normal build again carries no fixture
        run: npm run build && npm run check:no-fixture

  browsers:
    name: Browsers (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npm run build
      - name: Browser tests against the local preview (CloudKit from fixtures)
        run: npx playwright test --project=${{ matrix.project }}
      - name: The homepage specs on the launch fixture build
        run: PETS_LAUNCH=fixture npx playwright test --project=${{ matrix.project }} test/e2e/home
